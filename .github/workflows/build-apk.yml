name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:

  deploy-functions:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Supabase CLI kur
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: API Football secret ayarla
        run: |
          supabase secrets set API_FOOTBALL_KEY="${{ secrets.API_FOOTBALL_KEY }}" --project-ref "$SUPABASE_PROJECT_ID"

      - name: Edge Functions deploy et
        run: |
          supabase functions deploy sync-fixtures --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy compute-predictions --project-ref "$SUPABASE_PROJECT_ID"

      - name: Maçları senkronize et
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            "https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/sync-fixtures"

  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Android native iskeletini oluştur (gerekirse)
        run: |
          if [ ! -d "android" ]; then
            echo "android/ klasörü bulunamadı, oluşturuluyor..."
            cd ..
            flutter create --platforms=android --org com.futboltahmin --project-name futbol_tahmin temp_scaffold
            cp -r temp_scaffold/android mobile/android
            rm -rf temp_scaffold
            cd mobile
          fi

      - name: Android internet iznini ekle
        run: |
          manifest="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$manifest"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' "$manifest"
          fi

      - name: .env dosyasını oluştur (GitHub Secrets'tan)
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Bağımlılıkları indir
        run: flutter pub get

      - name: APK derle (release)
        run: flutter build apk --release

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: futbol-tahmin-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
